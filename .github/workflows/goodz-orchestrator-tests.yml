name: Goodz Orchestrator Tests

on:
  pull_request:
    paths:
      - 'scripts/goodz-orchestrator.mjs'
      - 'tests/orchestrator/**'
      - '.github/workflows/goodz-orchestrator*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/goodz-orchestrator.mjs'
      - 'tests/orchestrator/**'

permissions:
  contents: read

jobs:
  planner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: node --check scripts/goodz-orchestrator.mjs
      - name: Verify scheduling, conflict and safety cases
        run: node --test tests/orchestrator/planner.test.mjs
      - name: SonarCloud issue diagnostics (best effort, read-only)
        if: always() && github.event_name == 'pull_request'
        env:
          SONAR_PR: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, base64
          query=urllib.parse.urlencode({'componentKeys':'KayzenRoot_goodz-menu','pullRequest':os.environ['SONAR_PR'],'ps':100})
          request=urllib.request.Request('https://sonarcloud.io/api/issues/search?'+query,headers={'Accept':'application/json','User-Agent':'Goodz-ReadOnly-Diagnostics'})
          token=os.environ.get('SONAR_TOKEN','')
          if token:
            request.add_header('Authorization','Basic '+base64.b64encode((token+':').encode()).decode())
          try:
            with urllib.request.urlopen(request,timeout=10) as response:
              payload=json.load(response)
            issues=payload.get('issues',[])
            print('SonarCloud issues:',len(issues))
            for issue in issues[:100]:
              print(issue.get('severity','?'),issue.get('type','?'),issue.get('rule','?'),issue.get('component','?'),issue.get('line','?'),issue.get('message','?'))
          except Exception as error:
            print('SonarCloud issue diagnostic endpoint unavailable:',type(error).__name__)
          PY
