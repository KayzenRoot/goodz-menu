name: Goodz App Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: goodz-app-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Install, checks, security and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.8.1

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop and mobile browser checks
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm security:deps

      - name: Runtime secret scan
        run: pnpm security:secrets

      - name: Capture exact candidate manifest
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Could not resolve exact candidate/base commit.' >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          mkdir -p evidence-output
          python3 - "$BASE_SHA" "$CANDIDATE_SHA" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          base, head = sys.argv[1:3]
          revision = f"{base}...{head}"
          binary_diff = subprocess.run(
              ["git", "diff", "--binary", revision], check=True, capture_output=True
          ).stdout
          path_records = subprocess.run(
              ["git", "diff", "--no-renames", "--name-status", "-z", revision],
              check=True,
              capture_output=True,
          ).stdout.split(b"\0")
          path_records = [record for record in path_records if record]
          changed_paths = [
              {"status": path_records[index].decode("ascii"),
               "path": path_records[index + 1].decode("utf-8", "surrogateescape")}
              for index in range(0, len(path_records), 2)
          ]
          diff_sha256 = hashlib.sha256(binary_diff).hexdigest()
          compare_url = f"https://github.com/KayzenRoot/goodz-menu/compare/{base}...{head}"
          manifest = {
              "base_sha": base,
              "head_sha": head,
              "compare_url": compare_url,
              "binary_diff_sha256": diff_sha256,
              "changed_paths": changed_paths,
          }
          Path("evidence-output/HEAD-EVIDENCE.json").write_text(
              json.dumps(manifest, ensure_ascii=True, indent=2) + "\n", encoding="utf-8"
          )
          summary = (
              "## Exact candidate evidence\n\n"
              f"- Base SHA: `{base}`\n"
              f"- Head SHA: `{head}`\n"
              f"- [Exact base-to-head diff]({compare_url})\n"
              f"- Binary diff SHA-256: `{diff_sha256}`\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PY

      - name: Save exact-head manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goodz-foundation-head-manifest-${{ github.run_id }}
          path: evidence-output/HEAD-EVIDENCE.json
          if-no-files-found: error
          retention-days: 14
