name: Goodz App Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: goodz-app-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Install, checks, security and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.8.1

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop and mobile browser checks
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm security:deps

      - name: Runtime and candidate diff secret scans
        id: candidate_secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pnpm security:secrets
          pnpm security:diff

      - name: Capture exact candidate head and diff
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Could not resolve exact candidate/base commit.' >&2
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          mkdir -p evidence-output
          {
            printf '# Exact candidate evidence\n\n- Base SHA: `%s`\n- Head SHA: `%s`\n' "$BASE_SHA" "$CANDIDATE_SHA"
            printf '\n## Changed paths\n\n'
            git diff --name-status "${BASE_SHA}...${CANDIDATE_SHA}"
          } > evidence-output/HEAD-EVIDENCE.md
          git diff --binary "${BASE_SHA}...${CANDIDATE_SHA}" > evidence-output/HEAD.diff
          cat evidence-output/HEAD-EVIDENCE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save exact-head diff evidence
        if: always() && steps.candidate_secrets.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goodz-foundation-exact-head-${{ github.run_id }}
          path: evidence-output/
          if-no-files-found: error
          retention-days: 14

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goodz-foundation-screenshots-${{ github.run_id }}
          path: .engineering/evidence/GMZ-REBOOT-001/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
