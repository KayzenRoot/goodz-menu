name: Goodz App Foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goodz-app-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Install, checks, security and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop and mobile browser checks
        run: pnpm test:e2e

      - name: Dependency audit
        run: pnpm security:deps

      - name: Runtime secret scan
        run: pnpm security:secrets

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goodz-foundation-screenshots-${{ github.run_id }}
          path: .engineering/evidence/GMZ-REBOOT-001/screenshots/
          if-no-files-found: ignore
          retention-days: 14
