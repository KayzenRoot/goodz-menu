name: goodz-menu-reboot-001

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      GOODZ_ENVIRONMENT: local
      GOODZ_RUNTIME: docker
      BUILD_REVISION: ${BUILD_REVISION:-local}
      SUPABASE_API_URL: ${SUPABASE_API_URL:-http://host.docker.internal:56321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GOODZ_WEB_PORT:-3001}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
